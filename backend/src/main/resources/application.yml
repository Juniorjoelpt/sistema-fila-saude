server:
  port: 8080

spring:
  application:
    name: fila-saude-backend

  # JPA/Hibernate aponta para o datasource @Primary ("tenantRoutingDataSource"),
  # resolvido dinamicamente por requisicao — ver br.com.filasaude.tenancy.
  # Nao ha nenhum tenant resolvido no boot da aplicacao (o EntityManagerFactory e
  # construido de forma eager pelo Spring, antes de qualquer requisicao HTTP), entao
  # o Hibernate NAO PODE abrir conexao nesse momento para detectar dialeto/validar
  # schema — ddl-auto teria que ser "validate"/"update" contra "o" banco, mas aqui
  # existe um banco por tenant, escolhido apenas em tempo de requisicao.
  # Por isso:
  #  - database-platform fixo dispensa a deteccao automatica do dialeto via conexao;
  #  - use_jdbc_metadata_defaults=false evita uma segunda tentativa de conexao no boot;
  #  - ddl-auto=none desliga a validacao de schema do Hibernate — quem garante o
  #    schema de cada tenant e o Flyway, aplicado sob demanda (ver
  #    TenantDataSourceRegistry) no primeiro acesso aquele tenant.
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false

  # Flyway autoconfigurado fica desligado: master migra no boot (MasterFlywayRunner)
  # e cada tenant migra sob demanda, no primeiro acesso (TenantDataSourceRegistry).
  flyway:
    enabled: false

  # Importacao em lote (item 3.4, Fase 2) - planilhas de procedimentos/pacientes
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

filasaude:
  master-datasource:
    jdbc-url: ${MASTER_DB_URL:jdbc:mysql://localhost:3306/filasaude_master?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza}
    username: ${MASTER_DB_USER:root}
    password: ${MASTER_DB_PASSWORD:}
    pool-name: master-pool
    maximum-pool-size: 5

  jwt:
    secret: ${JWT_SECRET:changeme-super-secret-key-min-32-chars-long-for-hs256}
    expiration-minutes: 480

  # Painel de superadmin (item 3.6, Fase 2) - credencial unica do fornecedor
  # do SaaS, fora de qualquer tenant. Sobrescreva em producao via variaveis
  # de ambiente. O hash padrao corresponde a senha "admin123" (uso local).
  superadmin:
    email: ${SUPERADMIN_EMAIL:superadmin@filasaude.com.br}
    nome: ${SUPERADMIN_NOME:Suporte MS Soluções}
    password-hash: ${SUPERADMIN_PASSWORD_HASH:$2b$10$6tpFjLKqg2ySy4ZUMmQw4ehzGjOsg3sWpjshhvqjiliNe7uvsIeEy}

  mail:
    remetente: ${MAIL_REMETENTE:naoresponda@filasaude.com.br}

  # Alertas proativos de SLA vencido (varredura diária, ver SlaAlertaService).
  # dias-limite-atrasado usa o mesmo critério do badge "Atrasado" da fila
  # (nivelPrazo, no frontend) -- mantenha os dois sincronizados se alterar.
  sla:
    dias-limite-atrasado: ${SLA_DIAS_LIMITE_ATRASADO:15}
    cron: ${SLA_CRON:0 0 7 * * *}

  # Lembrete de agendamento + confirmação de presença (varredura diária, ver
  # LembreteAgendamentoService) -- envia dias-antes dias antes do horário
  # marcado (ver HorarioAgenda).
  lembrete:
    dias-antes: ${LEMBRETE_DIAS_ANTES:1}
    cron: ${LEMBRETE_CRON:0 0 8 * * *}

  frontend:
    # Padrão de URL do portal do cidadão por tenant, usado para montar o link
    # de confirmação de presença enviado por e-mail (ver
    # NotificacaoEmailService#linkConfirmacao). "{tenant}" é substituído pelo
    # slug do tenant. Em produção cada prefeitura acessa por um subdomínio
    # próprio (ver frontend/src/api/tenant.ts); em ambiente local, sobrescreva
    # via FRONTEND_URL_PATTERN, ex.: http://localhost:5173/?tenant={tenant}
    url-pattern: ${FRONTEND_URL_PATTERN:https://{tenant}.filasaude.com.br}

  # Lembrete de agendamento por WhatsApp (canal opcional, por tenant -- ver
  # NotificacaoWhatsappService / TipoIntegracao.WHATSAPP). As credenciais
  # (Phone Number ID + access token) ficam por tenant, na tela de
  # Integrações -- aqui só o que é igual para todo mundo: a versão da Graph
  # API da Meta e o nome/idioma do template de lembrete, que precisa estar
  # previamente aprovado na conta comercial de cada prefeitura.
  whatsapp:
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    template-lembrete: ${WHATSAPP_TEMPLATE_LEMBRETE:lembrete_agendamento}
    idioma-template: ${WHATSAPP_IDIOMA_TEMPLATE:pt_BR}
    # App Secret e verify token são do APP da Meta usado pela MS Soluções
    # (compartilhado por todos os tenants -- diferente do access token, que é
    # por tenant, na tela de Integrações). webhook-verify-token é qualquer
    # string escolhida por nós, cadastrada igual nos dois lados (aqui e na
    # configuração do webhook no Meta for Developers) -- serve só para a
    # verificação inicial da URL. Sem app-secret configurado, a verificação de
    # assinatura do webhook fica desligada (loga um aviso) -- ver
    # WhatsappAssinaturaValidator.
    app-secret: ${WHATSAPP_APP_SECRET:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

logging:
  level:
    br.com.filasaude: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
